name: mysql
base: core26
version: '9.7.1'
summary: MySQL server in a snap.
description: |
  The MySQL software delivers a very fast, multithreaded, multi-user,
  and robust SQL (Structured Query Language) database server. MySQL
  Server is intended for mission-critical, heavy-load production
  systems as well as for embedding into mass-deployed software.
title: MySQL
contact: https://matrix.to/#/#charmhub-data-platform:ubuntu.com
issues: https://github.com/canonical/mysql-snap/issues
source-code: https://github.com/canonical/mysql-snap
website: https://canonical.com/data/mysql

grade: stable
confinement: strict
license: Apache-2.0
platforms:
  amd64:
  arm64:
  #s390x:

system-usernames:
  snap_daemon: shared

hooks:
  install:
    plugs:
      - network
      - network-bind

slots:
  mysql-sockets:
    interface: content
    content: socket-directory
    write:
      - $SNAP_DATA/run

apps:
  mysqld:
    command: bin/mysqld.sh
    daemon: simple
    plugs:
      - network
      - network-bind
  mysql:
    command: usr/bin/mysql -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqladmin:
    command: usr/bin/mysqladmin -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqlcheck:
    command: usr/bin/mysqlcheck -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqldump:
    command: usr/bin/mysqldump -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqlimport:
    command: usr/bin/mysqlimport -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqlshow:
    command: usr/bin/mysqlshow -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network
  mysqlslap:
    command: usr/bin/mysqlslap -S $SNAP_DATA/run/mysqld.sock
    plugs:
      - network

parts:
  mysql-server:
    plugin: cmake
    source: https://cdn.mysql.com/Downloads/MySQL-9.7/mysql-9.7.1.tar.gz
    source-type: tar
    build-packages:
      - cmake
      - g++
      - bison
      - pkgconf
      - libssl-dev
      - libaio-dev
      - libicu-dev
      - libzstd-dev
      - libcurl4-openssl-dev
      - libfido2-dev
      - libmecab-dev
      - libprotobuf-dev
      - libprotoc-dev
      - protobuf-compiler
      - libevent-dev
      - libedit-dev
      - libnuma-dev
      - libtirpc-dev
      - libwrap0-dev
      - zlib1g-dev
      - liblz4-dev
      - lz4
      - perl
      - psmisc
      - unzip
      - chrpath
      - libgoogle-perftools-dev
    stage-packages:
      - libssl3t64
      - libaio1t64
      - libicu78
      - libzstd1
      - libcurl4t64
      - libfido2-1
      - libmecab2
      - libprotobuf32t64
      - libprotobuf-lite32t64
      - libevent-core-2.1-7t64
      - libedit2
      - libnuma1
      - libtirpc3t64
      - libwrap0
      - zlib1g
      - liblz4-1
      - libgoogle-perftools4t64
    cmake-parameters:
      # Small changes with respect to Debian packaging,
      # see https://salsa.debian.org/mariadb-team/mysql/-/blob/mysql-9.7/debian/latest/debian/rules
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_CONFIG=mysql_release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DINSTALL_LAYOUT=DEB
      - -DWITH_SYSTEM_LIBS=ON
      - -DWITH_MECAB=system
      - -DWITH_FIDO=system
      - -DWITH_ZLIB=system
      - -DWITH_TCMALLOC=system
      - -DWITH_ARCHIVE_STORAGE_ENGINE=ON
      - -DWITH_BLACKHOLE_STORAGE_ENGINE=ON
      - -DWITH_FEDERATED_STORAGE_ENGINE=ON
      - -DWITH_EXTRA_CHARSETS=all
      - -DWITH_EMBEDDED_SERVER=ON
      # Adjusted for snap paths
      - -DMYSQL_UNIX_ADDR=/var/snap/mysql/current/run/mysqld.sock
      - -DSYSCONFDIR=/var/snap/mysql/current/etc
      # Skip some components for faster compilation
      - -DWITH_NDB=OFF          # NDB Cluster (~20% of compile time)
      - -DWITH_UNIT_TESTS=OFF   # No unit tests
      - -DINSTALL_MYSQLTESTDIR=
    prime:
      # Mute lint by removing unnecessary MySQL libs
      # which are shipped as APT packages
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
      - -usr/lib/*/libprofiler.so*
      - -usr/lib/*/libtcmalloc_*
      - -usr/lib/*/libunwind-coredump.so*
      - -usr/lib/*/libunwind-ptrace.so*
      - -usr/lib/*/libunwind-x86_64.so*
      - -usr/lib/libmysqlclient.so*
      - -usr/lib/*/libevent_core*
      - -usr/lib/*/libfido2*
      - -usr/lib/*/libwrap*
    organize:
      usr/share/mysql-9.7/LICENSE: licenses/COPYRIGHT-mysql-server
  packages-deb:
    plugin: nil
    stage-packages:
      - util-linux
    organize:
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
  snap-scripts:
    plugin: dump
    source: snap/local
    source-type: local
    override-prime: |
      craftctl default
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' bin/*.sh
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' etc/*.cnf
